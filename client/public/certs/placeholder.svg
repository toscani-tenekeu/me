<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <pattern id="cert-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2a1e" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#0d1117"/>
  <!-- Grid overlay -->
  <rect width="400" height="300" fill="url(#cert-grid)" opacity="0.4"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.6"/>

  <!-- Certificate icon -->
  <g opacity="0.5">
    <!-- Ribbon -->
    <path d="M 160 80 Q 140 110 160 140" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
    <path d="M 240 80 Q 260 110 240 140" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>

    <!-- Document -->
    <rect x="140" y="120" width="120" height="130" rx="4" fill="none" stroke="#3fb950" stroke-width="1.5"/>

    <!-- Lines on document -->
    <line x1="155" y1="145" x2="245" y2="145" stroke="#3fb950" stroke-width="0.8"/>
    <line x1="155" y1="160" x2="245" y2="160" stroke="#3fb950" stroke-width="0.8"/>
    <line x1="155" y1="175" x2="225" y2="175" stroke="#3fb950" stroke-width="0.8"/>

    <!-- Seal/badge -->
    <circle cx="200" cy="210" r="18" fill="none" stroke="#3fb950" stroke-width="1"/>
    <circle cx="200" cy="210" r="14" fill="none" stroke="#3fb950" stroke-width="0.8"/>
  </g>

  <!-- Label -->
  <text x="200" y="260" text-anchor="middle" font-family="'Source Code Pro', 'Courier New', monospace" font-size="11" fill="#3fb950" opacity="0.7" letter-spacing="0.1em">// certificate_pending</text>
</svg>
